<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter - Explore Lumajang Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/admin-style.css">
    <style>
        /* Page specific overrides */
        .data-row,
        .data-header-row {
            grid-template-columns: 2fr 2fr 1.5fr 100px;
        }

        .interest-tag {
            background: rgba(55, 183, 195, 0.2);
            color: var(--primary);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            display: inline-block;
            margin-right: 5px;
            margin-bottom: 2px;
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <div class="brand"><i class="fa-solid fa-compass"></i> Admin Panel</div>
        <nav class="sidebar-nav">
            <a href="home-manager.html" class="nav-item"><i class="fa-solid fa-house-chimney"></i> Home Manager</a>
            <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-map-location-dot"></i> Destinasi</a>
            <a href="playlists.html" class="nav-item"><i class="fa-solid fa-list-ul"></i> Playlist</a>
            <a href="tips.html" class="nav-item"><i class="fa-solid fa-lightbulb"></i> Tips & Artikel</a>
            <a href="newsletter.html" class="nav-item active"><i class="fa-solid fa-envelope"></i> Newsletter</a>
        </nav>
        <button id="logout-btn" class="nav-item logout-btn"><i class="fa-solid fa-right-from-bracket"></i>
            Logout</button>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1 class="page-title">Subscriber Newsletter</h1>
            <div style="display:flex; gap:10px;">
                <input type="text" id="search-input" placeholder="Cari email...">
                <button id="export-btn" class="btn-add" style="background:var(--success);"><i
                        class="fa-solid fa-file-csv"></i> Export CSV</button>
            </div>
        </header>

        <div class="data-table-container">
            <div class="data-header-row">
                <span>Email</span>
                <span>Minat (Interests)</span>
                <span>Terdaftar</span>
                <span>Aksi</span>
            </div>
            <div id="newsletter-list">
                <div id="loading"><i class="fa-solid fa-spinner fa-spin"></i> Memuat data...</div>
            </div>
        </div>
    </main>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/newsletter.js"></script>
</body>

</html>
