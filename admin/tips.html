<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tips & Artikel - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #0f1c2e;
            --surface: #1f2b3e;
            --primary: #37b7c3;
            --danger: #ef4444;
            --text: #ffffff;
            --text-muted: #a0aec0;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 250px;
            background: rgba(0, 0, 0, 0.3);
            border-right: 1px solid var(--border);
            padding: 2rem 1rem;
            flex-shrink: 0;
        }

        .main-content {
            flex: 1;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .data-row {
            background: var(--surface);
            padding: 1rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border);
        }

        .data-row img {
            width: 60px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
            margin-right: 1rem;
        }

        .sidebar-nav a {
            display: block;
            padding: 1rem;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }

        .sidebar-nav a:hover,
        .sidebar-nav a.active {
            background: rgba(255, 255, 255, 0.05);
            color: var(--primary);
        }

        .action-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            margin-left: 0.5rem;
        }

        .action-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <h2 style="margin-top:0; margin-bottom: 2rem;">Admin Panel</h2>
        <nav class="sidebar-nav">
            <a href="dashboard.html"><i class="fa-solid fa-map-location-dot"></i> Destinasi</a>
            <a href="tips.html" class="active"><i class="fa-solid fa-lightbulb"></i> Tips & Artikel</a>
            <button id="logout-btn"
                style="width:100%; text-align:left; background:transparent; border:none; color:var(--danger); padding:1rem; cursor:pointer;"><i
                    class="fa-solid fa-right-from-bracket"></i> Keluar</button>
        </nav>
    </aside>

    <main class="main-content">
        <div class="header">
            <h1>Manajemen Tips</h1>
            <a href="form-tips.html" class="btn-primary"><i class="fa-solid fa-plus"></i> Tulis Artikel</a>
        </div>

        <div id="tips-list" class="list-container">
            <!-- Loaded by JS -->
            <p style="color:var(--text-muted)">Memuat data...</p>
        </div>
    </main>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/tips.js"></script>
</body>

</html>
