<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tips & Artikel - Explore Lumajang Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        <link rel="stylesheet" href="css/admin-style.css"><style>

        /* Page Overrides */
        .article-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .article-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .article-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .article-body {
            padding: 1.2rem;
        }

        .article-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .article-title {
            margin: 0 0 0.5rem 0;
            font-size: 1.1rem;
            line-height: 1.4;
            color: white;
        }

        .article-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .btn-sm-outline {
            padding: 0.4rem 0.8rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            background: none;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .btn-sm-outline:hover {
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="brand"><i class="fa-solid fa-compass"></i> Admin Panel</div>
        <nav class="sidebar-nav">
            <a href="home-manager.html" class="nav-item"><i class="fa-solid fa-house-chimney"></i> Home Manager</a>
            <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-map-location-dot"></i> Destinasi</a>
            <a href="playlists.html" class="nav-item"><i class="fa-solid fa-list-ul"></i> Playlist</a>
            <a href="tips.html" class="nav-item active"><i class="fa-solid fa-lightbulb"></i> Tips & Artikel</a>
            <a href="newsletter.html" class="nav-item"><i class="fa-solid fa-envelope"></i> Newsletter</a>
        </nav>
        <button id="logout-btn" class="nav-item logout-btn"><i class="fa-solid fa-right-from-bracket"></i>
            Logout</button>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1 class="page-title">Tips & Artikel</h1>
            <a href="form-article.html" class="btn-save"><i class="fa-solid fa-plus"></i> Artikel Baru</a>
        </header>

        <div id="article-list" class="article-grid">
            <div style="padding:2rem; text-align:center; color:#aaa; grid-column:1/-1;">Loading articles...</div>
        </div>
    </main>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/tips.js"></script>
</body>

</html>
