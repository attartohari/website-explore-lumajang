<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Tips & Artikel - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/admin-style.css">
</head>

<body>
    <aside class="sidebar">
        <div class="brand"><i class="fa-solid fa-compass"></i> Admin Panel</div>
        <nav class="sidebar-nav">
            <a href="home-manager.html" class="nav-item"><i class="fa-solid fa-house-chimney"></i> Home Manager</a>
            <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-map-location-dot"></i> Destinasi</a>
            <a href="playlists.html" class="nav-item"><i class="fa-solid fa-list-ul"></i> Playlist</a>
            <a href="tips.html" class="nav-item active"><i class="fa-solid fa-lightbulb"></i> Tips & Artikel</a>
            <a href="newsletter.html" class="nav-item"><i class="fa-solid fa-envelope"></i> Newsletter</a>
        </nav>
        <button id="logout-btn" class="nav-item logout-btn"><i class="fa-solid fa-right-from-bracket"></i>
            Logout</button>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1 class="page-title">Tips & Artikel</h1>
            <a href="form-article.html" class="btn-primary"><i class="fa-solid fa-plus"></i> Artikel Baru</a>
        </header>

        <section class="content-section">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Cover</th>
                            <th>Judul</th>
                            <th>Kategori</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="articles-table-body">
                        <!-- Injected -->
                        <tr>
                            <td colspan="5" style="text-align:center;">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script type="module">
        import { supabase, checkAuth } from '../utils/supabase.js';

        // Simple inline check for admin, assuming checkAuth redirects if fail
        // checkAuth(); // Make sure this function exists and works in admin context 
        // (Assuming admin pages share utils, but paths might differ ../utils vs ./utils)
        // Let's use relative path correctly: verify file structure.
        // d:\website-explore-lumajang\utils\supabase.js exists? Yes.
        // d:\website-explore-lumajang\admin\tips.html calling ../utils/supabase.js is CORRECT.

        document.addEventListener('DOMContentLoaded', loadArticles);
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        });

        async function loadArticles() {
            const { data, error } = await supabase
                .from('articles')
                .select('*')
                .order('created_at', { ascending: false });

            const tbody = document.getElementById('articles-table-body');

            if (error || !data) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:red;">Error: ${error?.message}</td></tr>`;
                return;
            }

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Belum ada artikel.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(item => `
                <tr>
                    <td>
                        <img src="${item.cover_image || '../assets/images/placeholder.jpg'}" style="width:50px; height:50px; object-fit:cover; border-radius:4px;">
                    </td>
                    <td>
                        <strong>${item.title}</strong><br>
                        <small style="color:#888;">/${item.slug}</small>
                        ${item.is_featured ? '<span style="font-size:0.7rem; background:#fbbf24; padding:2px 4px; border-radius:3px;margin-left:5px;">Featured</span>' : ''}
                    </td>
                    <td>${item.category}</td>
                    <td>
                        <span class="status-badge ${item.status === 'published' ? 'status-active' : 'status-inactive'}">
                            ${item.status}
                        </span>
                    </td>
                    <td>
                        <div class="action-buttons">
                            <a href="form-article.html?id=${item.id}" class="btn-icon" title="Edit"><i class="fa-solid fa-pen"></i></a>
                            <button onclick="window.deleteArticle(${item.id})" class="btn-icon delete" title="Hapus"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        window.deleteArticle = async (id) => {
            if (!confirm('Yakin ingin menghapus artikel ini?')) return;
            const { error } = await supabase.from('articles').delete().eq('id', id);
            if (error) alert('Gagal hapus: ' + error.message);
            else loadArticles();
        };
    </script>
</body>

</html>
