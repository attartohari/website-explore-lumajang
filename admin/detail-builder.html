<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Builder - Explore Lumajang Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/admin-style.css">
    <style>
        /* Detail Builder Specifics */
        .main-content {
            display: flex;
            gap: 2rem;
            height: 100vh;
            overflow: hidden;
            /* Prevent body scroll */
        }

        .builder-sidebar {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            height: 100%;
            overflow-y: auto;
            border-right: 1px solid var(--border);
            padding-right: 1rem;
        }

        .section-item {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-item.active {
            border-color: var(--primary);
            background: rgba(55, 183, 195, 0.1);
        }

        .drag-handle {
            cursor: grab;
            color: #666;
            margin-right: 10px;
        }

        .editor-area {
            flex: 1;
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 2rem;
            overflow-y: auto;
        }

        .preview-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            display: none;
            margin-top: 10px;
        }

        .preview-img.show {
            display: block;
        }

        .list-row {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="brand"><i class="fa-solid fa-compass"></i> Admin Panel</div>
        <nav class="sidebar-nav">
            <a href="home-manager.html" class="nav-item"><i class="fa-solid fa-house-chimney"></i> Home Manager</a>
            <a href="dashboard.html" class="nav-item active"><i class="fa-solid fa-map-location-dot"></i> Destinasi</a>
            <a href="playlists.html" class="nav-item"><i class="fa-solid fa-list-ul"></i> Playlist</a>
            <a href="tips.html" class="nav-item"><i class="fa-solid fa-lightbulb"></i> Tips & Artikel</a>
            <a href="newsletter.html" class="nav-item"><i class="fa-solid fa-envelope"></i> Newsletter</a>
        </nav>
        <button id="logout-btn" class="nav-item logout-btn"><i class="fa-solid fa-right-from-bracket"></i>
            Logout</button>
    </aside>

    <main class="main-content">
        <!-- Inner Sidebar -->
        <div class="builder-sidebar" id="section-list">
            <a href="dashboard.html" style="color:var(--text-muted); text-decoration:none; margin-bottom:1rem;"><i
                    class="fa-solid fa-arrow-left"></i> Kembali</a>
            <div style="padding: 1rem; background: rgba(0,0,0,0.2); border-radius: 8px; margin-bottom:1rem;">
                <label style="font-size: 0.8rem;">Editing:</label>
                <h3 id="dest-name" style="margin: 0.5rem 0; color: var(--primary);">Loading...</h3>
                <button id="save-all-btn" class="btn-save" style="width: 100%; margin-top: 1rem;">
                    <i class="fa-solid fa-save"></i> Save All
                </button>
            </div>

            <h3 style="margin:0;">Layout Sections</h3>
            <p style="font-size:0.8rem; color:#aaa; margin-top:0;">Drag to reorder, click to edit.</p>
            <!-- Injected -->
        </div>

        <!-- Editor Config -->
        <div class="editor-area" id="editor-panel">
            <div style="text-align:center; color:#aaa; margin-top: 30%;">
                <i class="fa-solid fa-pen-ruler" style="font-size: 3rem; margin-bottom: 1rem;"></i>
                <p>Select a section to edit its content.</p>
            </div>
        </div>
    </main>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/detail-builder.js"></script>
</body>

</html>
