<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Destinations - Explore Lumajang</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
    rel="stylesheet" />

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Main CSS -->
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <!-- HEADER / NAVBAR -->
  <div id="navbar-root"></div>

  <main style="padding-top: 80px; padding-bottom: 3rem;">

    <!-- HEADER SECTION -->
    <section class="dest-header-section">
      <div class="container">
        <h1 class="page-title">Temukan Destinasimu</h1>
        <p class="page-subtitle">Pilih sesuai suasana hati dan keinginanmu hari ini.</p>

        <!-- MOOD FILTERS -->
        <div class="mood-filters-wrapper">
          <div class="mood-filters-track">
            <button class="mood-chip active" data-mood="all">✨ Semua</button>
            <button class="mood-chip" data-mood="healing">🌿 Healing</button>
            <button class="mood-chip" data-mood="family">👨‍👩‍👧 Keluarga</button>
            <button class="mood-chip" data-mood="waterfall">💧 Air Terjun</button>
            <button class="mood-chip" data-mood="mountain">⛰️ Pegunungan</button>
            <button class="mood-chip" data-mood="easy">🚗 Akses Mudah</button>
            <button class="mood-chip" data-mood="budget">💸 Hemat</button>
          </div>
        </div>
      </div>
    </section>

    <div class="container split-layout">
      <!-- LEFT: DESTINATION GRID & TRENDING -->
      <div class="content-side">

        <!-- TRENDING WIDGET -->
        <div class="trending-widget">
          <div class="widget-header">
            <h3>🔥 Sedang Tren Minggu Ini</h3>
            <span class="season-badge">🌤️ Musim Kemarau</span>
          </div>
          <div class="trending-content" id="trending-content">
            <!-- Injected by JS -->
          </div>
        </div>

        <!-- COLLECTIONS BANNER -->
        <div class="collections-banner">
          <div class="col-head">
            <div class="col-text">
              <h4>Playlist Wisata</h4>
              <p>Kurasi pilihan untuk pengalaman maksimal.</p>
            </div>
            <button class="btn-sm-outline" onclick="window.openPlaylistModal()">Lihat Semua</button>
          </div>
          <div id="playlist-quick-list" class="playlist-quick-track">
            <!-- Playlists injected by JS -->
          </div>
        </div>

        <!-- MAIN GRID -->
        <div class="destination-grid" id="destination-grid">
          <!-- Cards injected by JS -->
        </div>
      </div>

      <!-- RIGHT: MAP SIDEBAR (Sticky) -->
      <div class="map-side">
        <div class="sticky-map-wrapper">
          <h3>Peta Wisata</h3>
          <div id="map-container"></div>

          <div class="mini-guide">
            <p><i class="fa-solid fa-circle-info"></i> Klik pin untuk melihat detail lokasi.</p>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- COMPARE FLOATING WIDGET -->
  <div class="compare-floating">
    <div class="compare-header">
      <span>Bandingkan (<span class="compare-count">0</span>)</span>
      <button onclick="window.toggleCompare()" class="close-compare"><i class="fa-solid fa-times"></i></button>
    </div>
    <div class="compare-items-panel"></div>
    <button id="do-compare" class="btn-primary full-width">Bandingkan Sekarang</button>
  </div>

  <div id="footer-root"></div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="utils/layout.js"></script>
  <script type="module" src="script.js"></script> <!-- Core Script (Navbar etc) -->
  <script type="module" src="destinations.js"></script> <!-- Page Specific Script -->
</body>

</html>
