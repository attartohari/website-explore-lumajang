<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tips & Artikel - Explore Lumajang</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="navbar-root"></div>

  <main id="tips-main">
    <!-- HERO -->
    <section class="tips-hero">
      <div class="container text-center">
        <h1 class="hero-title">Tips & Panduan Wisata</h1>
        <p class="hero-desc" style="max-width: 600px; margin: 0 auto;">
          Kumpulan informasi penting, itinerary, dan panduan lengkap untuk pengalaman terbaik di Lumajang.
        </p>

        <!-- SEARCH & FILTER -->
        <div class="search-filter-container mt-3">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="tips-search" placeholder="Cari artikel...">
          </div>
          <div class="filter-box">
            <select id="tips-category">
              <option value="All">Semua Kategori</option>
              <option value="Panduan">Panduan</option>
              <option value="Tips Hemat">Tips Hemat</option>
              <option value="Safety">Safety</option>
              <option value="Itinerary">Itinerary</option>
              <option value="Edukasi">Edukasi</option>
              <option value="Fotografi">Fotografi</option>
            </select>
          </div>
        </div>
      </div>
    </section>

    <!-- FEATURED / PINNED -->
    <section class="section" id="featured-section" style="padding-top: 2rem;">
      <div class="container">
        <div class="section-header">
          <span class="section-tag">Rekomendasi</span>
          <h2 class="section-title">Artikel Pilihan</h2>
        </div>
        <div id="featured-grid" class="featured-grid">
          <!-- Injected -->
        </div>
      </div>
    </section>

    <!-- LATEST ARTICLES -->
    <section class="section">
      <div class="container">
        <h2 class="section-title mb-4">Semua Artikel</h2>
        <div id="articles-grid" class="category-grid-12">
          <!-- Injected -->
        </div>

        <div id="empty-state" class="text-center text-muted mt-5" style="display:none;">
          <i class="fa-solid fa-file-circle-xmark" style="font-size: 3rem; margin-bottom: 1rem;"></i>
          <p>Tidak ada artikel ditemukan.</p>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>

  <script type="module" src="utils/layout.js"></script>
  <script type="module" src="js/tips.js"></script> <!-- Moved logic here -->
</body>

</html>
