<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tips & Artikel - Explore Lumajang</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="navbar-root"></div>

  <main style="padding-top: 100px; padding-bottom: 3rem; min-height: 80vh;">
    <div class="container">
      <div class="text-center mb-5">
        <h1 class="section-title">Tips & Panduan Wisata</h1>
        <p class="section-desc-center">Informasi penting untuk perjalanan yang lebih aman dan nyaman.</p>
      </div>

      <div id="articles-grid" class="category-grid-12">
        <div class="col-12 text-center text-muted">Loading articles...</div>
      </div>
    </div>
  </main>

  <div id="footer-root"></div>

  <script type="module" src="utils/layout.js"></script>
  <script type="module" src="script.js"></script>

  <script type="module">
    import { supabase } from './utils/supabase.js';

    async function loadArticles() {
      // Fetch data
      const { data, error } = await supabase
        .from('articles')
        .select('*')
        .eq('status', 'published')
        .order('created_at', { ascending: false });

      const container = document.getElementById('articles-grid');

      if (!data || data.length === 0) {
        container.innerHTML = '<div class="col-12 text-center">Belum ada artikel.</div>';
        return;
      }

      container.innerHTML = data.map(item => `
            <a href="detail-tips.html?slug=${item.slug}" class="cat-card-new" style="display:block; text-decoration:none; padding:0; overflow:hidden;">
                 <div style="height: 200px; overflow: hidden;">
                    <img src="${item.cover_image || 'assets/images/placeholder.jpg'}" style="width: 100%; height: 100%; object-fit: cover; transition: 0.3s;">
                 </div>
                 <div style="padding: 1.5rem;">
                     <span style="font-size: 0.8rem; color: var(--accent); text-transform:uppercase; letter-spacing:1px;">${item.category}</span>
                     <h3 style="margin: 0.5rem 0; color: white;">${item.title}</h3>
                 </div>
            </a>
        `).join('');
    }

    loadArticles();
  </script>
</body>

</html>
